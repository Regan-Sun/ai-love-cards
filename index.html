<header><div class="brand">一聊心动<span>耕幸福 · 爱情卡牌</span></div><div class="header-actions"><nav class="stage-shortcuts" aria-label="快速切换阶段"><button data-jump="know">相识</button><button data-jump="trust">相知</button><button data-jump="love">相爱</button></nav><div class="header-note">让每一次对话，都更靠近一点</div><button id="mainFullscreen" aria-pressed="false">全屏 ⛶</button></div></header>
<main>
<section class="hero" aria-label="爱情卡牌互动区">
<div class="intro"><div class="eyebrow">A LITTLE CLOSER, ONE CARD AT A TIME</div><h1>从一句话开始，<br>到<em>两颗心靠近。</em></h1><p class="description">有些心动，藏在日常的小事里。<br>抽一张卡，分享一个故事，也听听对方的答案。<br>99 个话题，留给你们慢慢聊。</p>
<span class="filter-label">选择关系阶段，开启专属沟通话题</span>
<div class="filters phase-list" aria-label="关系阶段">

<script>
'use strict';
const cards=JSON.parse(document.getElementById('card-data').textContent);
const $=id=>document.getElementById(id);
let stage='all',category='all',filtered=cards,index=0,flipped=false;
const stageGuides={know:{image:'assets/相识-了解期-阶段说明.png',description:'轻松破冰，发现彼此的独特之处',categories:'美食 · 爱好 · 回忆 · 生活 · 消费'},trust:{image:'assets/相知-信任期-阶段说明.png',description:'深入交流，建立安全与信任',categories:'工作 · 形象 · 场所 · 社交 · 观念 · 心境'},love:{image:'assets/相爱-浓情期-阶段说明.png',description:'表达爱意，让亲密持续升温',categories:'依恋 · 未来'}};
const stageOf=card=>card.id<=33?'know':card.id<=66?'trust':'love';
for(const name of new Set(cards.map(c=>c.category))){const option=document.createElement('option');option.value=name;option.textContent=name;$('category').append(option)}
function flip(){flipped=!flipped;updateFace()}
function updateFace(){
 $('card').classList.toggle('flipped',flipped);$('card').setAttribute('aria-pressed',String(flipped));
 $('card').setAttribute('aria-label',flipped?'翻到正面，查看话题':'翻到背面，查看聊天灵感');
 document.querySelector('.front').setAttribute('aria-hidden',String(flipped));document.querySelector('.back').setAttribute('aria-hidden',String(!flipped));
 $('flipHint').textContent=flipped?'聊天灵感 · 点击回到话题':'点击卡牌翻面 · 左右滑动切换';
}
function show(){
 const c=filtered[index];flipped=false;updateFace();$('imageError').classList.remove('visible');
 $('card').disabled=!c;$('prev').disabled=!c||index===0;$('next').disabled=!c||index===filtered.length-1;$('random').disabled=!c;
 if(!c){$('front').removeAttribute('src');$('back').removeAttribute('src');$('position').textContent='暂无卡牌';$('currentInfo').textContent='试试其他阶段或话题';return}
 $('front').src=c.front;$('back').src=c.back;$('front').alt=`第 ${c.id} 张 · ${c.category} · 正面话题`;$('back').alt=`第 ${c.id} 张 · ${c.category} · 背面聊天灵感`;
 $('position').textContent=`${String(index+1).padStart(2,'0')} / ${String(filtered.length).padStart(2,'0')}`;$('currentInfo').textContent=`NO. ${String(c.id).padStart(3,'0')} · ${c.category}`;
 for(const button of $('grid').querySelectorAll('.thumbnail'))button.setAttribute('aria-current',String(Number(button.dataset.id)===c.id));
}
function applyFilters(){
 filtered=cards.filter(c=>(stage==='all'||stageOf(c)===stage)&&(category==='all'||c.category===category));index=0;
 $('grid').replaceChildren();
 for(const [key,title] of [['know','相识 · 了解期'],['trust','相知 · 信任期'],['love','相爱 · 浓情期']]){const groupCards=filtered.filter(c=>stageOf(c)===key);if(!groupCards.length)continue;const section=document.createElement('section');section.className='card-group';section.dataset.stageGroup=key;section.id='topics-'+key;const heading=document.createElement('h3');heading.textContent=title;const guide=stageGuides[key];const overview=document.createElement('div');overview.className='stage-overview';const guideImage=document.createElement('img');guideImage.src=guide.image;guideImage.alt=title+'：完整阶段目标与阶段状态';guideImage.loading='lazy';const intro=document.createElement('div');intro.className='stage-intro';const eyebrow=document.createElement('p');eyebrow.className='stage-kicker';eyebrow.textContent='先了解这一程';const summary=document.createElement('h4');summary.textContent=guide.description;const topics=document.createElement('p');topics.textContent=guide.categories;const instructions=document.createElement('p');instructions.textContent='先了解阶段目标，再挑一张话题卡。慢慢分享，也认真倾听。';const anchor=document.createElement('a');anchor.href='#cards-'+key;anchor.textContent=`开始聊 · ${groupCards.length} 张话题卡 →`;intro.append(eyebrow,summary,topics,instructions,anchor);overview.append(intro,guideImage);const cardHeading=document.createElement('h4');cardHeading.className='stage-cards-title';cardHeading.id='cards-'+key;cardHeading.textContent=`${title} · ${groupCards.length} 张话题卡`;const groupGrid=document.createElement('div');groupGrid.className='group-grid';section.append(heading,overview,cardHeading,groupGrid);$('grid').append(section);for(const c of groupCards){const button=document.createElement('button');button.className='thumbnail';button.dataset.id=c.id;button.setAttribute('aria-label',`打开第 ${c.id} 张${c.category}卡牌`);const img=document.createElement('img');img.src=c.front;img.alt='';img.loading='lazy';img.decoding='async';const label=document.createElement('span');label.textContent=`${String(c.id).padStart(3,'0')} / ${c.category}`;button.append(img,label);button.addEventListener('click',()=>{const back=button.dataset.flipped!=='true';button.dataset.flipped=String(back);button.setAttribute('aria-pressed',String(back));img.src=back?c.back:c.front;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)img.animate([{opacity:.65,transform:'scale(.985)'},{opacity:1,transform:'scale(1)'}],{duration:240,easing:'ease-out'});label.textContent=`${String(c.id).padStart(3,'0')} / ${c.category} · ${back?'背面':'正面'}`;button.setAttribute('aria-label',`第 ${c.id} 张${c.category}，点击翻到${back?'正面':'背面'}`);});groupGrid.append(button)}}

 $('collectionCount').textContent=`当前 ${filtered.length} 张 · 选择一张，开始对话`;setupDeck();show();

function move(delta){if(index+delta>=0&&index+delta<filtered.length){index+=delta;show()}}
$('card').addEventListener('click',flip);$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
$('random').addEventListener('click',()=>{if(filtered.length>1)index=(index+1+Math.floor(Math.random()*(filtered.length-1)))%filtered.length;show()});
$('category').addEventListener('change',e=>{category=e.target.value;applyFilters()});
for(const button of document.querySelectorAll('[data-stage]'))button.addEventListener('click',()=>{stage=button.dataset.stage;category='all';$('category').value='all';for(const b of document.querySelectorAll('[data-stage]'))b.setAttribute('aria-pressed',String(b===button));applyFilters();const module=stage==='all'?document.querySelector('.collection'):document.getElementById('topics-'+stage);goToSlide(module===document.querySelector('.collection')?deckSlides[1]:module);});
for(const img of [$('front'),$('back')])img.addEventListener('error',()=>{if(img.hasAttribute('src'))$('imageError').classList.add('visible')});
document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();changePage(-1)}if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();changePage(1)}if(e.key==='Home'){e.preventDefault();goToSlide(deckSlides[0])}});
let startX=0,startY=0,swiped=false;
$('card').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY;swiped=false},{passive:true});
$('card').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){swiped=true;move(dx<0?1:-1)}},{passive:true});
$('card').addEventListener('click',e=>{if(swiped){e.stopImmediatePropagation();swiped=false}},true);

function isFullscreen(){return Boolean(document.fullscreenElement||document.webkitFullscreenElement||document.webkitIsFullScreen);}
function syncFullscreenButton(){const active=isFullscreen();$('mainFullscreen').textContent=active?'退出全屏 ⛶':'全屏 ⛶';$('mainFullscreen').setAttribute('aria-pressed',String(active));}
async function toggleFullscreen(){
 const button=$('mainFullscreen');if(button.disabled)return;button.disabled=true;
 try{const active=isFullscreen();const target=active?document:document.documentElement;const action=active?(document.exitFullscreen||document.webkitExitFullscreen||document.webkitCancelFullScreen):(target.requestFullscreen||target.webkitRequestFullscreen||target.webkitRequestFullScreen);
 if(!action){button.title=active?'当前浏览器无法通过网页退出全屏，请按 Esc。':'当前浏览器不支持网页全屏。';return;}
 await action.call(target);button.removeAttribute('title');
 }catch{button.title=isFullscreen()?'退出全屏未成功，请按 Esc 或再次点击。':'浏览器未允许全屏，请再次点击。';}
 finally{button.disabled=false;syncFullscreenButton();}
}
$('mainFullscreen').addEventListener('click',toggleFullscreen);
for(const event of ['fullscreenchange','webkitfullscreenchange'])document.addEventListener(event,syncFullscreenButton);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&isFullscreen())toggleFullscreen();});
syncFullscreenButton();

for(const button of document.querySelectorAll('[data-guide]'))button.addEventListener('click',()=>{document.querySelector(`[data-stage="${button.dataset.guide}"]`).click();});

let deckSlides=[],deckIndex=0;
function setupDeck(){
 const pageSize=matchMedia('(max-width:600px)').matches?1:3;const root=$('grid');const groups=[...root.querySelectorAll('.card-group')];root.replaceChildren();
 for(const group of groups){const key=group.dataset.stageGroup;const heading=group.querySelector('h3');const overview=group.querySelector('.stage-overview');const buttons=[...group.querySelectorAll('.thumbnail')];const intro=document.createElement('section');intro.className='ppt-slide stage-slide';intro.id='topics-'+key;intro.dataset.stageGroup=key;intro.append(heading,overview);root.append(intro);
 for(let offset=0;offset<buttons.length;offset+=pageSize){const page=document.createElement('section');page.className='ppt-slide cards-slide';page.dataset.stageGroup=key;if(offset===0)page.id='cards-'+key;const title=document.createElement('h3');title.textContent=`${heading.textContent} · 话题 ${offset+1}–${Math.min(offset+pageSize,buttons.length)} / ${buttons.length}`;const grid=document.createElement('div');grid.className='group-grid';grid.append(...buttons.slice(offset,offset+pageSize));page.append(title,grid);root.append(page)}
 overview.querySelector('a').addEventListener('click',e=>{e.preventDefault();goToSlide(document.getElementById('cards-'+key))});
 }
 const hero=document.querySelector('.hero');hero.classList.add('ppt-slide');deckSlides=[hero,...root.querySelectorAll('.ppt-slide')];deckIndex=0;goToSlide(hero);
}
function goToSlide(slide){const next=deckSlides.indexOf(slide);if(next<0)return;deckIndex=next;document.body.dataset.viewStage=slide.dataset.stageGroup||'home';$('deckProgress').style.width=((deckIndex+1)/deckSlides.length*100)+'%';for(const button of document.querySelectorAll('[data-jump]'))button.setAttribute('aria-current',String(button.dataset.jump===slide.dataset.stageGroup));for(const item of deckSlides)item.classList.toggle('active-slide',item===slide);document.querySelector('.collection').hidden=deckIndex===0;$('deckPosition').textContent=`${deckIndex+1} / ${deckSlides.length}`;$('deckPrev').disabled=deckIndex===0;$('deckNext').disabled=deckIndex===deckSlides.length-1;}
function changePage(delta){goToSlide(deckSlides[deckIndex+delta])}
for(const button of document.querySelectorAll('[data-jump]'))button.addEventListener('click',()=>document.querySelector(`[data-stage="${button.dataset.jump}"]`).click());
$('deckHome').addEventListener('click',()=>goToSlide(deckSlides[0]));$('deckPrev').addEventListener('click',()=>changePage(-1));$('deckNext').addEventListener('click',()=>changePage(1));

applyFilters();
</script>
</body></html>
