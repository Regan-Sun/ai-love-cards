name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许后续部署任务等待本次部署完成
permissions:
  contents: read
  pages: write
  id-token: write

# 同分支并发运行时取消旧任务，避免部署队列堆积
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 私有仓库的 Pages 默认未启用，enablement: true 让本步骤自动开启
          enablement: true

      - name: 上传静态站点产物
        # 仓库根目录即站点根目录：index.html + assets/
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4